databaseChangeLog:
  - changeSet:
      id: 1782109886425-1
      author: HP
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      # Tablo zaten varsa bu changeset'i çalıştırmadan geç (MARK_RAN)
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: candidate_profiles
      changes:
        - createTable:
            columns:
              - column:
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_candıdate_profıles
                  name: id
                  type: INT
              - column:
                  constraints:
                    nullable: false
                  name: user_id
                  type: INT
              - column:
                  name: phone_number
                  type: VARCHAR(255)
              - column:
                  name: title
                  type: VARCHAR(255)
              - column:
                  name: resume_url
                  type: VARCHAR(255)
              - column:
                  name: skills
                  type: TEXT
              - column:
                  name: experience
                  type: TEXT
              - column:
                  name: education
                  type: TEXT
            tableName: candidate_profiles
  - changeSet:
      id: 1782109886425-2
