  - changeSet:
      id: 1782109886425-3
      author: HP
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - addUniqueConstraint:
            columnNames: user_id
            constraintName: uc_candıdate_profıles_user
            tableName: candidate_profiles
  - changeSet:
      id: 1782109886425-4
      author: HP
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - addUniqueConstraint:
            columnNames: user_id
            constraintName: uc_employer_profıles_user
            tableName: employer_profiles
  - changeSet:
      id: 1782109886425-5
      author: HP
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - addForeignKeyConstraint:
            baseColumnNames: user_id
            baseTableName: candidate_profiles
            constraintName: FK_CANDIDATE_PROFILES_ON_USER
            referencedColumnNames: id
            referencedTableName: users
  - changeSet:
      id: 1782109886425-6
      author: HP
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
