version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: smartmatch-db
    environment:
      POSTGRES_DB: smartmatch_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "20033691ecrin"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartmatch_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smartmatch-redis
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: smartmatch-app
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/smartmatch_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD="20033691ecrin"
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379

volumes:
  postgres_data: