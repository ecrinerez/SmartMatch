version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: smartmatch-db-prod
    restart: unless-stopped # Konteyner çökerse manuel durdurulmadığı sürece otomatik yeniden başlar
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: smartmatch-redis-prod
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"

  app:
    build: .
    container_name: smartmatch-app-prod
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db
      - redis
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:${DB_PORT}/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_API_URL=${GEMINI_API_URL}

volumes:
  postgres_prod_data: